name: Documentation
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        Help us improve ERD Builder Pro's documentation.

  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is missing, incorrect, or unclear?
      placeholder: |
        The installation guide doesn't mention the required Node.js version.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: How should the documentation be improved?
      placeholder: |
        Add a section explaining how to set up the PostgreSQL database connection.
    validations:
      required: true

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation type
      options:
        - README / Getting Started
        - Installation / Setup
        - Feature guide (ERD, Flowchart, Notes, Drawing)
        - AI Assistant guide
        - API / Backend
        - Deployment
        - Contributing guide
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Related page or file
      description: Link or path to the affected documentation.
      placeholder: README.md or docs/erd-guide.md

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, examples, references, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing documentation issues before creating this report.
          required: true
