name: Build & Release

on:
  push:
    tags:
      - 'v*' # v2.1.5 (stable, from master)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 2.2.0-rc.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Build Tauri app (Linux/Windows)
        if: matrix.platform != 'macos'
        shell: bash
        run: npx tauri build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CARGO_NET_RETRY: '5'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign bundles (Linux/Windows)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          set -euo pipefail
          # Sign all built bundles: AppImage, deb, msi
          for ext in AppImage deb msi; do
            BUNDLE=$(find src-tauri/target/release/bundle -name "*.${ext}" ! -name "*.sig" 2>/dev/null | head -1)
            if [ -n "$BUNDLE" ]; then
              echo "Signing: $BUNDLE"
              npx tauri signer sign \
                --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
                --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                "$BUNDLE"
            fi
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # macOS: build ARM64 first, then rebuild native modules for x86_64, then cross-compile.
      # We use --bundles app (skip DMG) because Tauri's built-in bundle_dmg.sh (create-dmg fork)
      # intermittently fails on CI runners (tauri#3055, #13804). DMG is created manually below.
      - name: Build Tauri app (ARM64)
        if: matrix.platform == 'macos'
        shell: bash
        run: npx tauri build --bundles app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create .app.tar.gz (ARM64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "src-tauri/target/release/bundle/dmg"
          COPYFILE_DISABLE=1 tar -czf "src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.app.tar.gz" \
            -C src-tauri/target/release/bundle/macos "ERD Builder Pro.app"

      - name: Create DMG (ARM64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          bash src-tauri/scripts/create-dmg.sh \
            "src-tauri/target/release/bundle/macos/ERD Builder Pro.app" \
            "${DMG_DIR}/ERD Builder Pro_${VERSION}_aarch64.dmg" \
            --volicon "src-tauri/icons/icon.icns"

      - name: Sign DMG (ARM64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_PATH="src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.dmg"
          npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$DMG_PATH"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign .app.tar.gz (ARM64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAR_PATH="src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.app.tar.gz"
          npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$TAR_PATH"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rebuild better-sqlite3 for x86_64
        if: matrix.platform == 'macos'
        shell: bash
        run: npm_config_arch=x64 npm rebuild better-sqlite3

      - name: Build Tauri app (x86_64)
        if: matrix.platform == 'macos'
        shell: bash
        run: npx tauri build --target x86_64-apple-darwin --bundles app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          npm_config_arch: x64
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create .app.tar.gz (x86_64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          COPYFILE_DISABLE=1 tar -czf "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.app.tar.gz" \
            -C src-tauri/target/x86_64-apple-darwin/release/bundle/macos "ERD Builder Pro.app"

      - name: Create DMG (x86_64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DMG_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          bash src-tauri/scripts/create-dmg.sh \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ERD Builder Pro.app" \
            "${DMG_DIR}/ERD Builder Pro_${VERSION}_x86_64.dmg" \
            --volicon "src-tauri/icons/icon.icns"

      - name: Sign DMG (x86_64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.dmg"
          npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$DMG_PATH"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign .app.tar.gz (x86_64)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAR_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.app.tar.gz"
          npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$TAR_PATH"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename and collect macOS bundles + signatures
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dmg-output

          # ARM64 DMG
          cp "src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.dmg" \
             "dmg-output/ERD-Builder-Pro_${VERSION}_aarch64.dmg"

          # ARM64 app.tar.gz
          cp "src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.app.tar.gz" \
             "dmg-output/ERD-Builder-Pro_${VERSION}_aarch64.app.tar.gz"

          # x86_64 DMG
          cp "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.dmg" \
             "dmg-output/ERD-Builder-Pro_${VERSION}_x86_64.dmg"

          # x86_64 app.tar.gz
          cp "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.app.tar.gz" \
             "dmg-output/ERD-Builder-Pro_${VERSION}_x86_64.app.tar.gz"

          # Copy sig files (explicitly by expected names)
          for sigsrc in \
            "src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.dmg.sig" \
            "src-tauri/target/release/bundle/dmg/ERD Builder Pro_${VERSION}_aarch64.app.tar.gz.sig" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.dmg.sig" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ERD Builder Pro_${VERSION}_x86_64.app.tar.gz.sig"; do
            [ -f "$sigsrc" ] && sigdest="dmg-output/$(basename "$sigsrc")" && cp "$sigsrc" "$sigdest"
          done

          echo "Collected DMGs to dmg-output/:"
          ls -la dmg-output/

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dmg-output/
          if-no-files-found: error

      - name: Upload Linux/Windows artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.zip
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.tar.bz2
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1 || echo "")
          CURRENT_TAG="${GITHUB_REF_NAME}"

          if [ -n "$PREV_TAG" ]; then
            bash scripts/generate-release-notes.sh "$PREV_TAG" "$CURRENT_TAG" > release-notes.md
          else
            bash scripts/generate-release-notes.sh "$CURRENT_TAG" > release-notes.md
          fi

          echo "Generated release notes:"
          cat release-notes.md

      - name: Generate updater latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # ── macOS: .app.tar.gz for updater, DMGs for manual download ──
          # For the updater, use .app.tar.gz (the only format supported on macOS)
          ARM_TAR_SIG_FILE=$(find artifacts/build-macos -name "*_aarch64.app.tar.gz.sig" 2>/dev/null | head -1)
          INTEL_TAR_SIG_FILE=$(find artifacts/build-macos -name "*_x86_64.app.tar.gz.sig" 2>/dev/null | head -1)
          ARM_SIG=""; [ -n "$ARM_TAR_SIG_FILE" ] && ARM_SIG=$(cat "$ARM_TAR_SIG_FILE")
          INTEL_SIG=""; [ -n "$INTEL_TAR_SIG_FILE" ] && INTEL_SIG=$(cat "$INTEL_TAR_SIG_FILE")

          ARM_TAR_NAME=$(find artifacts/build-macos -name "*_aarch64.app.tar.gz" 2>/dev/null | head -1 | xargs basename)
          INTEL_TAR_NAME=$(find artifacts/build-macos -name "*_x86_64.app.tar.gz" 2>/dev/null | head -1 | xargs basename)
          [ -z "$ARM_TAR_NAME" ] && ARM_TAR_NAME="ERD-Builder-Pro_${VERSION}_aarch64.app.tar.gz"
          [ -z "$INTEL_TAR_NAME" ] && INTEL_TAR_NAME="ERD-Builder-Pro_${VERSION}_x86_64.app.tar.gz"

          # ── Linux: find AppImage and .deb separately ──
          LINUX_APPIMAGE=$(find artifacts/build-linux -name "*.AppImage" 2>/dev/null | head -1)
          LINUX_DEB=$(find artifacts/build-linux -name "*.deb" 2>/dev/null | head -1)
          LINUX_APPIMAGE_NAME=""; LINUX_APPIMAGE_SIG=""
          LINUX_DEB_NAME=""; LINUX_DEB_SIG=""

          if [ -n "$LINUX_APPIMAGE" ]; then
            APPIMAGE_NAME_ORIG=$(basename "$LINUX_APPIMAGE")
            LINUX_APPIMAGE_NAME=$(echo "$APPIMAGE_NAME_ORIG" | sed 's/ /./g')
            SIG_FILE=$(find artifacts/build-linux -name "${APPIMAGE_NAME_ORIG}.sig" 2>/dev/null | head -1)
            [ -z "$SIG_FILE" ] && SIG_FILE=$(find artifacts/build-linux -name "*.sig" 2>/dev/null | head -1)
            [ -n "$SIG_FILE" ] && LINUX_APPIMAGE_SIG=$(cat "$SIG_FILE")
          fi

          if [ -n "$LINUX_DEB" ]; then
            DEB_NAME_ORIG=$(basename "$LINUX_DEB")
            LINUX_DEB_NAME=$(echo "$DEB_NAME_ORIG" | sed 's/ /./g')
            SIG_FILE=$(find artifacts/build-linux -name "${DEB_NAME_ORIG}.sig" 2>/dev/null | head -1)
            [ -z "$SIG_FILE" ] && SIG_FILE=$(find artifacts/build-linux -name "*.sig" 2>/dev/null | head -1)
            [ -n "$SIG_FILE" ] && LINUX_DEB_SIG=$(cat "$SIG_FILE")
          fi

          # ── Windows: find MSI ──
          WIN_MSI=$(find artifacts/build-windows -name "*.msi.zip" 2>/dev/null | head -1)
          [ -z "$WIN_MSI" ] && WIN_MSI=$(find artifacts/build-windows -name "*.msi" 2>/dev/null | head -1)
          WIN_BUNDLE_NAME=""; WIN_SIG=""
          if [ -n "$WIN_MSI" ]; then
            WIN_NAME_ORIG=$(basename "$WIN_MSI")
            WIN_BUNDLE_NAME=$(echo "$WIN_NAME_ORIG" | sed 's/ /./g')
            # Strip .zip suffix for .sig lookup (sig matches the original .msi, not .msi.zip)
            WIN_SIG_LOOKUP=$(basename "$WIN_MSI" .zip)
            WIN_SIG_FILE=$(find artifacts/build-windows -name "${WIN_SIG_LOOKUP}.sig" -o -name "${WIN_BUNDLE_NAME}.sig" 2>/dev/null | head -1)
            [ -z "$WIN_SIG_FILE" ] && WIN_SIG_FILE=$(find artifacts/build-windows -name "*.msi.sig" 2>/dev/null | head -1)
            [ -n "$WIN_SIG_FILE" ] && WIN_SIG=$(cat "$WIN_SIG_FILE")
          fi

          # ── Build JSON ──
          jq -n \
            --arg v "$VERSION" \
            --arg date "$DATE" \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg arm_url "${BASE_URL}/${ARM_TAR_NAME}" \
            --arg intel_url "${BASE_URL}/${INTEL_TAR_NAME}" \
            --arg arm_sig "$ARM_SIG" \
            --arg intel_sig "$INTEL_SIG" \
            --arg linux_name "${LINUX_APPIMAGE_NAME}" \
            --arg linux_sig "${LINUX_APPIMAGE_SIG}" \
            --arg linux_deb_name "${LINUX_DEB_NAME}" \
            --arg linux_deb_sig "${LINUX_DEB_SIG}" \
            --arg win_name "${WIN_BUNDLE_NAME}" \
            --arg win_sig "${WIN_SIG}" \
            '{
              version: $v,
              notes: ("See https://github.com/" + $repo + "/releases/tag/" + $tag),
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: $arm_sig, url: $arm_url },
                "darwin-x86_64": { signature: $intel_sig, url: $intel_url }
              }
            }
            | if $linux_name != "" then .platforms["linux-x86_64"] = {
                signature: $linux_sig,
                url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $linux_name)
              } else . end
            | if $linux_deb_name != "" then .platforms["linux-x86_64-deb"] = {
                signature: $linux_deb_sig,
                url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $linux_deb_name)
              } else . end
            | if $win_name != "" then .platforms["windows-x86_64"] = {
                signature: $win_sig,
                url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $win_name)
              } else . end' > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          generate_release_notes: false
          files: |
            artifacts/build-linux/**/*.deb
            artifacts/build-linux/**/*.AppImage
            artifacts/build-linux/**/*.tar.gz
            artifacts/build-linux/**/*.tar.bz2
            artifacts/build-linux/**/*.sig
            artifacts/build-windows/**/*.msi
            artifacts/build-windows/**/*.msi.zip
            artifacts/build-windows/**/*.exe
            artifacts/build-windows/**/*.sig
            artifacts/build-macos/*_aarch64.dmg
            artifacts/build-macos/*_aarch64.dmg.sig
            artifacts/build-macos/*_x86_64.dmg
            artifacts/build-macos/*_x86_64.dmg.sig
            artifacts/build-macos/*_aarch64.app.tar.gz
            artifacts/build-macos/*_aarch64.app.tar.gz.sig
            artifacts/build-macos/*_x86_64.app.tar.gz
            artifacts/build-macos/*_x86_64.app.tar.gz.sig
            latest.json

      - name: Append unsigned notice to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |
            > ⚠️ **Important Notice**
            >
            > This desktop application is **not registered with Apple or Microsoft**, so it:
            > - Will likely be **flagged by Gatekeeper (macOS)** or **SmartScreen (Windows)** on first launch
            > - Cannot receive automatic updates through official store channels
            > - May require manual security overrides to run (System Settings → Privacy & Security → Open Anyway)
            >
            > To update, re-download the latest build from this releases page.
            > We're actively working on code signing and platform registration. Stay tuned.
            >
            > 💡 **Alternative**: For the smoothest experience, consider using the [CLI app](https://www.npmjs.com/package/erdbpro), [Docker](https://hub.docker.com/r/bekenweb/erd-builder-pro), or self-hosting on your own server — no OS security warnings, always up-to-date.
