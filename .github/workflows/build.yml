name: Build & Release

on:
  push:
    tags:
      - 'v*' # v2.1.5 (stable, from master)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 2.2.0-rc.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Build Tauri app (Linux/Windows)
        if: matrix.platform != 'macos'
        shell: bash
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # macOS: build ARM64 first, then rebuild native modules for x86_64, then cross-compile
      - name: Build Tauri app (ARM64)
        if: matrix.platform == 'macos'
        shell: bash
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rebuild better-sqlite3 for x86_64
        if: matrix.platform == 'macos'
        shell: bash
        run: npm_config_arch=x64 npm rebuild better-sqlite3

      - name: Build Tauri app (x86_64)
        if: matrix.platform == 'macos'
        shell: bash
        run: npx tauri build --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename and collect macOS DMGs + signatures
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dmg-output

          # ARM64 DMG (default target)
          cp "src-tauri/target/release/bundle/dmg"/*.dmg "dmg-output/ERD-Builder-Pro_${VERSION}_aarch64.dmg"
          if ls "src-tauri/target/release"/*.sig 2>/dev/null; then
            cp "src-tauri/target/release"/*.sig "dmg-output/ERD-Builder-Pro_${VERSION}_aarch64.dmg.sig" 2>/dev/null || true
          fi

          # x86_64 DMG (cross-compiled)
          cp "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"/*.dmg "dmg-output/ERD-Builder-Pro_${VERSION}_x86_64.dmg"
          if ls "src-tauri/target/x86_64-apple-darwin/release"/*.sig 2>/dev/null; then
            cp "src-tauri/target/x86_64-apple-darwin/release"/*.sig "dmg-output/ERD-Builder-Pro_${VERSION}_x86_64.dmg.sig" 2>/dev/null || true
          fi

          echo "Collected DMGs to dmg-output/:"
          ls -la dmg-output/

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dmg-output/
          if-no-files-found: error

      - name: Upload Linux/Windows artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.zip
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.tar.bz2
            src-tauri/target/release/*.sig
          if-no-files-found: warn

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1 || echo "")
          VERSION="${GITHUB_REF_NAME#v}"

          {
            echo "### What's Changed"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              git log --pretty="- %s" "$PREV_TAG..HEAD" 2>/dev/null || echo "No commits found."
            else
              git log --pretty="- %s" 2>/dev/null | head -30 || echo "Initial release."
            fi

            echo ""
            echo "---"
            echo ""
            echo "### 📥 Download"
            echo "Download the appropriate installer for your operating system below."
            echo ""
            echo "### 🖥️ Supported Platforms"
            echo "- **macOS** (Apple Silicon / Intel) — \`.dmg\`"
            echo "- **Windows** (x64) — \`.msi\`"
            echo "- **Linux** (x64) — \`.deb\` / \`.AppImage\`"
          } > release-notes.md

          echo "Generated release notes:"
          cat release-notes.md

      - name: Generate updater latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Find signature files from macOS artifact (single dir with both DMGs)
          ARM_SIG_FILE=$(find artifacts/build-macos -name "*aarch64*.sig" 2>/dev/null | head -1)
          INTEL_SIG_FILE=$(find artifacts/build-macos -name "*x86_64*.sig" 2>/dev/null | head -1)

          ARM_SIG=""
          INTEL_SIG=""
          if [ -n "$ARM_SIG_FILE" ]; then
            ARM_SIG=$(cat "$ARM_SIG_FILE")
          fi
          if [ -n "$INTEL_SIG_FILE" ]; then
            INTEL_SIG=$(cat "$INTEL_SIG_FILE")
          fi

          ARM_DMG_NAME="ERD-Builder-Pro_${VERSION}_aarch64.dmg"
          INTEL_DMG_NAME="ERD-Builder-Pro_${VERSION}_x86_64.dmg"

          jq -n \
            --arg v "$VERSION" \
            --arg date "$DATE" \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg arm_url "https://github.com/${REPO}/releases/download/${TAG}/${ARM_DMG_NAME}" \
            --arg intel_url "https://github.com/${REPO}/releases/download/${TAG}/${INTEL_DMG_NAME}" \
            --arg arm_sig "$ARM_SIG" \
            --arg intel_sig "$INTEL_SIG" \
            '{
              version: $v,
              notes: ("See https://github.com/" + $repo + "/releases/tag/" + $tag),
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: $arm_sig, url: $arm_url },
                "darwin-x86_64": { signature: $intel_sig, url: $intel_url }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          generate_release_notes: false
          files: |
            artifacts/build-linux/**/*.deb
            artifacts/build-linux/**/*.AppImage
            artifacts/build-linux/**/*.tar.gz
            artifacts/build-linux/**/*.tar.bz2
            artifacts/build-linux/**/*.sig
            artifacts/build-windows/**/*.msi
            artifacts/build-windows/**/*.msi.zip
            artifacts/build-windows/**/*.sig
            artifacts/build-macos/*_aarch64.dmg
            artifacts/build-macos/*_aarch64.dmg.sig
            artifacts/build-macos/*_x86_64.dmg
            artifacts/build-macos/*_x86_64.dmg.sig
            latest.json
