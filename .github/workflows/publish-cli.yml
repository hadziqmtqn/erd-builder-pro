name: Publish CLI

on:
  push:
    tags:
      - "v*"  # git tag v2.5.5 → publish to latest + GitHub Release
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: "beta"
        options:
          - "beta"
          - "latest"
      version:
        description: "Version (leave empty = read from package.json)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-menubar:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Build universal macOS Menu Bar helper
        run: |
          swiftc -O -target arm64-apple-macosx11.0 cli/menubar/ERDBProTray.swift -o /tmp/erdbpro-tray-arm64
          swiftc -O -target x86_64-apple-macosx11.0 cli/menubar/ERDBProTray.swift -o /tmp/erdbpro-tray-x86_64
          lipo -create /tmp/erdbpro-tray-arm64 /tmp/erdbpro-tray-x86_64 -output cli/menubar/erdbpro-tray
          cp public/favicon.svg cli/menubar/icon.svg
          lipo cli/menubar/erdbpro-tray -verify_arch arm64 x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: cli-menubar
          path: |
            cli/menubar/erdbpro-tray
            cli/menubar/icon.svg
          if-no-files-found: error

  build-and-publish:
    needs: build-menubar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DB_VARIANT: sqlite

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download macOS Menu Bar helper
        uses: actions/download-artifact@v8
        with:
          name: cli-menubar
          path: cli/menubar

      - run: chmod +x cli/menubar/erdbpro-tray

      # Trusted Publishing requires npm >=11.5.1; pin npm 11 to avoid npm 12's
      # install-time security default changes during this release build.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.20.0

      - name: Install deps
        run: npm ci

      - name: Prisma generate (SQLite)
        run: npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Build server bundle
        run: node scripts/build-server.js

      - name: Build frontend
        run: |
          rm -rf dist
          VITE_API_URL="" npx vite build

      - name: Assemble CLI package
        run: |
          rm -rf cli/dist-server cli/dist cli/prisma
          cp -r dist-server cli/dist-server
          cp -r dist cli/dist
          mkdir -p cli/prisma
          cp prisma/schema.sqlite.prisma cli/prisma/
          cp dist-server/schema.sql cli/prisma/ 2>/dev/null || true

          # Regenerate Prisma client with SQLite schema for CLI
          rm -rf node_modules/.prisma/client
          DB_VARIANT=sqlite npx prisma generate --schema=prisma/schema.sqlite.prisma --generator client
          cp -r node_modules/.prisma/client cli/dist-server/node_modules/.prisma/

          # Copy better-sqlite3 for correct Node ABI
          cp -r node_modules/better-sqlite3 cli/dist-server/node_modules/

      - name: Sync version from root
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          node -e "const p=require('./cli/package.json');p.version='$VERSION';require('fs').writeFileSync('./cli/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Publishing erdbpro@${VERSION}"

      - name: Determine npm tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=$(node -p "require('./cli/package.json').version")
            if [[ "$VERSION" == *-* ]]; then
              echo "tag=beta" >> $GITHUB_OUTPUT
            else
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: cd cli && npm publish --tag ${{ steps.tag.outputs.tag }}
