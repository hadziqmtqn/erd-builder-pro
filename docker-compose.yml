services:
  erd-builder-pro:
    build:
      context: .
      args:
        - VITE_ENABLE_GUEST_MODE=${VITE_ENABLE_GUEST_MODE:-false}
    ports:
      - "3000:3000"
    volumes:
      # Volume mount for SQLite — data persists across container restarts
      - erd-data:/app/data
    restart: unless-stopped
    environment:
      # Guest mode & AI Chat for guests (both disabled by default)
      - VITE_ENABLE_GUEST_MODE=${VITE_ENABLE_GUEST_MODE:-false}
      - GUEST_AI_ENABLED=${GUEST_AI_ENABLED:-false}
    # ── Database: uncomment ONE section ──
    #
    # Option 1: Pure PostgreSQL (recommended for production)
    # environment:
    #   - DATABASE_URL=postgresql://user:password@db:5432/erd_builder_pro
    # depends_on:
    #   - db
    #
    # Option 2: Supabase (managed PostgreSQL + Auth)
    # environment:
    #   - DATABASE_URL=postgresql://postgres:[YOUR-PASSWORD]@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
    #   - SUPABASE_URL=https://your-project.supabase.co
    #
    # Option 3: SQLite (default, zero-config — no environment needed)

volumes:
  erd-data:
